name: workload-credential-authority-pg

on:
  pull_request:
    paths:
      - "src/agent_control_plane/workload_credentials.py"
      - "src/agent_control_plane/workload_credential_http.py"
      - "src/agent_control_plane/workload_credential_service.py"
      - "migrations/workload_credential_authority_v1.sql"
      - "tests/test_workload_credential_authority*.py"
      - "tests/test_credential_approval_projection.py"
      - "tests/test_workload_credential_service.py"
      - ".github/workflows/workload-credential-authority-pg.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workload-credential-authority-pg-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ACP_WORKLOAD_CREDENTIAL_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: avaargsh/cloud-agent-runtime
          # Runtime PR #52 current integration head; pins the canonical Run authority reader and approval-revocation role router.
          ref: 396487d1dfa845b8fb937d536a9fd299aec187fd
          path: cloud-agent-runtime
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev,identity-authority]"
      - run: pip install -e "./cloud-agent-runtime[dev]"
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Install the reviewed schema
        run: |
          psql "$ACP_WORKLOAD_CREDENTIAL_DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -f migrations/workload_credential_authority_v1.sql
      - name: Verify authority, idempotency, revocation and outbox against PostgreSQL
        run: |
          pytest -q \
            tests/test_workload_credential_authority.py \
            tests/test_workload_credential_authority_pg.py \
            tests/test_workload_credential_authority_https.py \
            tests/test_workload_credential_authority_cross_repo.py \
            tests/test_credential_approval_projection.py \
            tests/test_workload_credential_service.py
