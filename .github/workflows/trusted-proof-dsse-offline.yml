name: trusted-proof-dsse-offline
on:
  pull_request:
    paths:
      - 'src/agent_control_plane/trusted_proof_envelope.py'
      - 'tests/test_trusted_proof_envelope.py'
      - 'docs/TRUSTED_PROOF_DSSE_OFFLINE.md'
      - 'pyproject.toml'
      - '.github/workflows/trusted-proof-dsse-offline.yml'
  push:
    branches: [main]
    paths:
      - 'src/agent_control_plane/trusted_proof_envelope.py'
      - 'tests/test_trusted_proof_envelope.py'
      - 'pyproject.toml'
      - '.github/workflows/trusted-proof-dsse-offline.yml'
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,proof-verify]'
      - run: python -m ruff check src/agent_control_plane/trusted_proof_envelope.py tests/test_trusted_proof_envelope.py
      - run: python -m pytest -q tests/test_trusted_proof_envelope.py tests/test_independent_verifier.py
