name: pr-watch-postgres-admission

on:
  pull_request:
    paths:
      - 'examples/pr_watch_pg_admission.py'
      - 'examples/pr_watch_pg_migrations.py'
      - 'tests/test_pr_watch_pg_migrations.py'
      - 'docs/PR_WATCH_POSTGRES_MIGRATIONS.md'
      - 'examples/pr_watch_pg_dispatcher.py'
      - 'examples/pr_watch_pg_store.py'
      - 'examples/pr_watch_pg_webhook.py'
      - 'examples/pr_watch_webhook_envelope.py'
      - 'tests/test_pr_watch_pg_webhook.py'
      - 'tests/test_pr_watch_pg_webhook_e2e.py'
      - 'tests/test_pr_watch_tls_ingress.py'
      - 'examples/pr_watch_nginx_staging.conf.template'
      - 'docs/PR_WATCH_TLS_STAGING.md'
      - 'examples/pr_watch_pilot_evidence.py'
      - 'tests/test_pr_watch_pilot_evidence.py'
      - 'examples/pr_watch_github_delivery_evidence.py'
      - 'tests/test_pr_watch_github_delivery_evidence.py'
      - 'docs/PR_WATCH_GITHUB_DELIVERY_EVIDENCE.md'
      - 'docs/PR_WATCH_PILOT_EVIDENCE.md'
      - 'docs/PR_WATCH_PG_WEBHOOK_INBOX.md'
      - 'examples/pr_watch_pg_runtime.py'
      - 'examples/pr_watch_service.py'
      - 'examples/pr_watch_temporal.py'
      - 'examples/attention_telegram_adapter.py'
      - 'tests/test_pr_watch_pg_runtime.py'
      - 'tests/test_pr_watch_pg_process_chaos.py'
      - 'tests/pr_watch_pg_server_crash.py'
      - 'tests/test_pr_watch_pg_worker_takeover.py'
      - 'tests/pr_watch_pg_logical_restore.py'
      - 'docs/PR_WATCH_TEMPORAL_TAKEOVER_AND_PG_RESTORE.md'
      - 'docs/PR_WATCH_POSTGRES_SERVER_CRASH.md'
      - 'docs/PR_WATCH_POSTGRES_PROCESS_CHAOS.md'
      - 'docs/PR_WATCH_POSTGRES_RUNTIME.md'
      - 'tests/test_pr_watch_pg_store.py'
      - 'docs/PR_WATCH_POSTGRES_V2_STORE.md'
      - 'tests/test_pr_watch_pg_admission.py'
      - 'docs/PR_WATCH_POSTGRES_ADMISSION.md'
      - 'pyproject.toml'
      - '.github/workflows/pr-watch-postgres-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: prwatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d prwatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PR_WATCH_PG_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/prwatch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install real localhost TLS ingress prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx openssl
          test -x /usr/sbin/nginx
      - name: Install isolated PostgreSQL pilot dependencies
        run: python -m pip install -e '.[dev,pg-pilot]' 'temporalio>=1.8,<2' 'pytest-timeout>=2.3,<3'
      - name: Ruff PostgreSQL admission
        run: python -m ruff check examples/pr_watch_pg_migrations.py examples/pr_watch_pg_admission.py examples/pr_watch_pg_dispatcher.py examples/pr_watch_pg_store.py examples/pr_watch_pg_runtime.py examples/pr_watch_service.py examples/pr_watch_temporal.py examples/attention_telegram_adapter.py tests/test_pr_watch_pg_admission.py tests/test_pr_watch_pg_store.py tests/test_pr_watch_pg_runtime.py tests/test_pr_watch_pg_process_chaos.py tests/test_pr_watch_pg_migrations.py tests/pr_watch_pg_server_crash.py tests/test_pr_watch_pg_worker_takeover.py tests/pr_watch_pg_logical_restore.py examples/pr_watch_pg_webhook.py examples/pr_watch_webhook_envelope.py tests/test_pr_watch_pg_webhook.py tests/test_pr_watch_pg_webhook_e2e.py examples/pr_watch_pilot_evidence.py tests/test_pr_watch_pilot_evidence.py examples/pr_watch_github_delivery_evidence.py tests/test_pr_watch_github_delivery_evidence.py
      - name: Run real PostgreSQL and Temporal test-server integration
        run: python -m pytest -q tests/test_pr_watch_pg_admission.py tests/test_pr_watch_pg_store.py tests/test_pr_watch_pg_runtime.py tests/test_pr_watch_pg_webhook.py tests/test_pr_watch_pg_webhook_e2e.py tests/test_pr_watch_pilot_evidence.py tests/test_pr_watch_github_delivery_evidence.py -x
      - name: Versioned PostgreSQL upgrade and rollback against isolated schemas
        run: python -m pytest -q tests/test_pr_watch_pg_migrations.py -x --timeout=30
      - name: Multi-process SIGTERM fault injection (per-test timeout)
        run: python -m pytest -vv -s tests/test_pr_watch_pg_process_chaos.py -x --timeout=45
      - name: Temporal Worker SIGKILL takeover against real SDK and PG16
        run: python -m pytest -vv -s tests/test_pr_watch_pg_worker_takeover.py -x --timeout=75
      - name: PostgreSQL logical backup and restore into isolated database
        env:
          PR_WATCH_PG_SERVICE_ID: ${{ job.services.postgres.id }}
        run: python tests/pr_watch_pg_logical_restore.py
      - name: Physical PostgreSQL SIGKILL and WAL recovery
        env:
          PR_WATCH_PG_SERVICE_ID: ${{ job.services.postgres.id }}
        run: python tests/pr_watch_pg_server_crash.py
