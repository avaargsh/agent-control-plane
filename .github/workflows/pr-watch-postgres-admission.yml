name: pr-watch-postgres-admission

on:
  pull_request:
    paths:
      - 'examples/pr_watch_pg_admission.py'
      - 'examples/pr_watch_pg_dispatcher.py'
      - 'examples/pr_watch_pg_store.py'
      - 'examples/pr_watch_pg_runtime.py'
      - 'examples/pr_watch_service.py'
      - 'examples/pr_watch_temporal.py'
      - 'examples/attention_telegram_adapter.py'
      - 'tests/test_pr_watch_pg_runtime.py'
      - 'tests/test_pr_watch_pg_process_chaos.py'
      - 'docs/PR_WATCH_POSTGRES_PROCESS_CHAOS.md'
      - 'docs/PR_WATCH_POSTGRES_RUNTIME.md'
      - 'tests/test_pr_watch_pg_store.py'
      - 'docs/PR_WATCH_POSTGRES_V2_STORE.md'
      - 'tests/test_pr_watch_pg_admission.py'
      - 'docs/PR_WATCH_POSTGRES_ADMISSION.md'
      - 'pyproject.toml'
      - '.github/workflows/pr-watch-postgres-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: prwatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d prwatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PR_WATCH_PG_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/prwatch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install isolated PostgreSQL pilot dependencies
        run: python -m pip install -e '.[dev,pg-pilot]' 'temporalio>=1.8,<2' 'pytest-timeout>=2.3,<3'
      - name: Ruff PostgreSQL admission
        run: python -m ruff check examples/pr_watch_pg_admission.py examples/pr_watch_pg_dispatcher.py examples/pr_watch_pg_store.py examples/pr_watch_pg_runtime.py examples/pr_watch_service.py examples/pr_watch_temporal.py examples/attention_telegram_adapter.py tests/test_pr_watch_pg_admission.py tests/test_pr_watch_pg_store.py tests/test_pr_watch_pg_runtime.py tests/test_pr_watch_pg_process_chaos.py
      - name: Run real PostgreSQL and Temporal test-server integration
        run: python -m pytest -q tests/test_pr_watch_pg_admission.py tests/test_pr_watch_pg_store.py tests/test_pr_watch_pg_runtime.py -x
      - name: Multi-process SIGTERM fault injection (per-test timeout)
        run: python -m pytest -vv -s tests/test_pr_watch_pg_process_chaos.py -x --timeout=45
