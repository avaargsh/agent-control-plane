name: pr-watch-github-live-evidence-contract
on:
  pull_request:
    paths:
      - 'examples/pr_watch_github_delivery_evidence.py'
      - 'examples/pr_watch_webhook.py'
      - 'tests/test_pr_watch_github_delivery_evidence.py'
      - 'tests/test_pr_watch_temporal_signal_cardinality.py'
      - 'tests/test_pr_watch_webhook_temporal_e2e.py'
      - 'docs/PR_WATCH_GITHUB_DELIVERY_EVIDENCE.md'
      - 'docs/M6_LIVE_DELIVERY_ACCEPTANCE.md'
      - '.github/workflows/pr-watch-github-live-evidence-contract.yml'
  push:
    branches: [main]
    paths:
      - 'examples/pr_watch_github_delivery_evidence.py'
      - 'examples/pr_watch_webhook.py'
      - 'tests/test_pr_watch_github_delivery_evidence.py'
      - 'tests/test_pr_watch_temporal_signal_cardinality.py'
      - '.github/workflows/pr-watch-github-live-evidence-contract.yml'
permissions:
  contents: read
jobs:
  hook-and-wake-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: prwatch_evidence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d prwatch_evidence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PR_WATCH_PG_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/prwatch_evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,pg-pilot]'
      - name: Lint read-only official GitHub hook / temporal evidence
        run: python -m ruff check examples/pr_watch_github_delivery_evidence.py examples/pr_watch_webhook.py tests/test_pr_watch_github_delivery_evidence.py tests/test_pr_watch_temporal_signal_cardinality.py
      - name: Real PG16 scoped inbox plus negative Hook and History tests
        run: python -m pytest -q -x tests/test_pr_watch_github_delivery_evidence.py tests/test_pr_watch_temporal_signal_cardinality.py tests/test_pr_watch_webhook.py
