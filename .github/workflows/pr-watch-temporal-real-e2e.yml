name: pr-watch-temporal-real-e2e

on:
  pull_request:
    paths:
      - 'examples/pr_watch_temporal.py'
      - 'examples/pr_watch_control_bridge.py'
      - 'examples/pr_watch_service.py'
      - 'tests/test_pr_watch_control_bridge.py'
      - 'tests/test_pr_watch_service.py'
      - 'examples/pr_watch_harness.py'
      - 'tests/test_pr_watch_temporal_e2e.py'
      - 'docs/PR_WATCH_TEMPORAL_E2E.md'
      - 'docs/PR_WATCH_TEMPORAL_CONTROL_JOURNAL.md'
      - '.github/workflows/pr-watch-temporal-real-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]' 'temporalio>=1.8,<2'
      - run: python -m ruff check examples/pr_watch_temporal.py examples/pr_watch_control_bridge.py examples/pr_watch_service.py tests/test_pr_watch_temporal_e2e.py tests/test_pr_watch_control_bridge.py
      - name: Test against Temporal time-skipping server
        run: python -m pytest -q tests/test_pr_watch_temporal_e2e.py tests/test_pr_watch_control_bridge.py tests/test_pr_watch_service.py -x
