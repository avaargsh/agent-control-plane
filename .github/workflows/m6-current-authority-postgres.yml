name: m6-current-authority-postgres
on:
  pull_request:
    paths:
      - 'src/agent_control_plane/live_effect_pg.py'
      - 'src/agent_control_plane/live_effect_boundary.py'
      - 'src/agent_control_plane/kubernetes_deployment_transition.py'
      - 'tests/test_live_effect_pg.py'
      - 'tests/test_live_effect_boundary.py'
      - 'docs/M6_CURRENT_AUTHORITY_POSTGRES.md'
      - 'pyproject.toml'
      - '.github/workflows/m6-current-authority-postgres.yml'
  push:
    branches: [main]
    paths:
      - 'src/agent_control_plane/live_effect_pg.py'
      - 'src/agent_control_plane/live_effect_boundary.py'
      - 'src/agent_control_plane/kubernetes_deployment_transition.py'
      - 'tests/test_live_effect_pg.py'
      - 'pyproject.toml'
      - '.github/workflows/m6-current-authority-postgres.yml'
permissions:
  contents: read
jobs:
  scoped-effect-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: live_effect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d live_effect_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ACP_LIVE_EFFECT_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/live_effect_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,live-effect-pg]'
      - name: Ruff PG16 current-authority gate
        run: python -m ruff check src/agent_control_plane/live_effect_pg.py src/agent_control_plane/live_effect_boundary.py tests/test_live_effect_pg.py
      - name: PG16 revoked approval, role denial, patch lock and lifecycle
        run: python -m pytest -q -x tests/test_live_effect_pg.py tests/test_live_effect_boundary.py tests/test_execution_lifecycle.py
