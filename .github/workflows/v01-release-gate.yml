name: v0.1-release-gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "schemas/**"
      - "examples/**"
      - "experiments/**"
      - "scripts/verify_release.py"
      - "scripts/verify_v01_public_contract.py"
      - "scripts/fresh_clone_release_smoke.sh"
      - "release/**"
      - "pyproject.toml"
      - "Makefile"
      - "Makefile"
      - "RELEASE_NOTES.md"
      - "RELEASE_READINESS.md"
      - "docs/V0.1_ACCEPTANCE_ARTIFACT_CONTRACT.md"
      - "docs/V0.1_PUBLIC_COMPATIBILITY.md"
      - "docs/V0.1_FREEZE.md"
      - "docs/RELEASE_VERIFICATION.md"
      - ".github/workflows/v01-release-gate.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "schemas/**"
      - "examples/**"
      - "experiments/**"
      - "scripts/verify_release.py"
      - "scripts/verify_v01_public_contract.py"
      - "scripts/fresh_clone_release_smoke.sh"
      - "release/**"
      - "pyproject.toml"
      - "RELEASE_NOTES.md"
      - "RELEASE_READINESS.md"
      - "docs/V0.1_ACCEPTANCE_ARTIFACT_CONTRACT.md"
      - "docs/V0.1_PUBLIC_COMPATIBILITY.md"
      - "docs/V0.1_FREEZE.md"
      - "docs/RELEASE_VERIFICATION.md"
      - ".github/workflows/v01-release-gate.yml"

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install release dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install pinned gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan full git history
        run: make audit-history
      - name: Run release verifier
        run: make verify-release
      - name: Run fresh-clone package smoke
        run: |
          set -o pipefail
          sh scripts/fresh_clone_release_smoke.sh \
            | tee /tmp/fresh-clone-release.txt
      - name: Stage release evidence
        if: always()
        run: |
          set -euo pipefail
          test -f .artifacts/release/verification.json
          test -f /tmp/fresh-clone-release.txt
          rm -rf /tmp/v01-package-release-proof
          mkdir -p /tmp/v01-package-release-proof
          cp -R .artifacts/release/. /tmp/v01-package-release-proof/
          cp /tmp/fresh-clone-release.txt \
            /tmp/v01-package-release-proof/fresh-clone-release.log
          find /tmp/v01-package-release-proof -maxdepth 2 \
            -type f -printf '%P\n' | sort

      - name: Upload release proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v01-release-gate-proof
          path: /tmp/v01-package-release-proof/
          if-no-files-found: error
