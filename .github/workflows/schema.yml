name: schema

on:
  push:
  pull_request:

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate every JSON schema
        run: |
          set -euo pipefail
          for schema in schemas/*.schema.json; do
            echo "validating $schema"
            python -m json.tool "$schema" >/dev/null
          done
      - name: Validate example manifests against schemas
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
          agent-control-plane validate examples/golden-slice.yaml
          agent-control-plane validate examples/vertical-slice.yaml
          agent-control-plane validate examples/manifests.yaml
