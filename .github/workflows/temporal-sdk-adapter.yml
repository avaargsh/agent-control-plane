name: temporal-sdk-adapter

on:
  pull_request:
    paths:
      - "src/agent_control_plane/temporal_sdk_api.py"
      - "src/agent_control_plane/temporal_runtime_client.py"
      - "tests/test_temporal_sdk_api.py"
      - "tests/test_temporal_sdk_worker_handoff.py"
      - "pyproject.toml"
      - ".github/workflows/temporal-sdk-adapter.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sdk-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional Temporal SDK
        run: python -m pip install -e ".[dev,temporal]"
      - name: Validate SDK adapter and server memo binding
        run: python -m pytest -q tests/test_temporal_sdk_api.py tests/test_temporal_sdk_worker_handoff.py
      - name: Check narrow adapter lint
        run: python -m ruff check src/agent_control_plane/temporal_sdk_api.py tests/test_temporal_sdk_api.py tests/test_temporal_sdk_worker_handoff.py
