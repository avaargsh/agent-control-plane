name: persistent-pr-watch-harness

on:
  pull_request:
    paths:
      - 'examples/pr_watch_*.py'
      - 'examples/pr_watch_panel.*'
      - 'tests/test_pr_watch_service.py'
      - 'tests/test_pr_watch_webhook.py'
      - 'examples/pr_watch_webhook_envelope.py'
      - 'docs/PR_WATCH_GITHUB_WEBHOOK_WAKE.md'
      - 'docs/PR_WATCH_LOCAL_API_PILOT.md'
      - 'tests/test_pr_watch_harness.py'
      - 'docs/PR_WATCH_HARNESS_VERTICAL_SLICE.md'
      - '.github/workflows/persistent-pr-watch-harness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]' 'temporalio>=1.8,<2'
      - run: python -m ruff check examples/pr_watch_harness.py examples/pr_watch_github.py examples/pr_watch_temporal.py examples/pr_watch_service.py examples/pr_watch_webhook.py tests/test_pr_watch_webhook.py examples/pr_watch_webhook_envelope.py
      - run: pytest -q tests/test_pr_watch_harness.py tests/test_attention_plane_reference.py tests/test_pr_watch_service.py tests/test_pr_watch_webhook.py
      - run: node --check examples/pr_watch_panel.js
      - run: PYTHONPATH=examples python -c 'import pr_watch_temporal; print(pr_watch_temporal.TASK_QUEUE)'
