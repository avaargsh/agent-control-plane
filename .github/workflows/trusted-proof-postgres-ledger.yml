name: trusted-proof-postgres-ledger
on:
  pull_request:
    paths:
      - 'src/agent_control_plane/trusted_proof_pg.py'
      - 'src/agent_control_plane/trusted_proof_pg_security.py'
      - 'src/agent_control_plane/trusted_proof_envelope.py'
      - 'tests/test_trusted_proof_pg.py'
      - 'tests/test_trusted_proof_pg_security.py'
      - 'tests/test_trusted_proof_envelope.py'
      - 'docs/TRUSTED_PROOF_PG_LEDGER.md'
      - 'docs/TRUSTED_PROOF_PG_SECURITY.md'
      - 'pyproject.toml'
      - '.github/workflows/trusted-proof-postgres-ledger.yml'
  push:
    branches: [main]
    paths:
      - 'src/agent_control_plane/trusted_proof_pg.py'
      - 'src/agent_control_plane/trusted_proof_pg_security.py'
      - 'tests/test_trusted_proof_pg.py'
      - 'tests/test_trusted_proof_pg_security.py'
      - 'pyproject.toml'
      - '.github/workflows/trusted-proof-postgres-ledger.yml'
permissions:
  contents: read
jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: proof_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d proof_validation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ACP_TRUSTED_PROOF_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/proof_validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,proof-ledger]'
      - name: Static checks
        run: python -m ruff check src/agent_control_plane/trusted_proof_pg.py src/agent_control_plane/trusted_proof_pg_security.py tests/test_trusted_proof_pg.py tests/test_trusted_proof_pg_security.py
      - name: Real PG16 signed-proof admission + replay
        run: python -m pytest -q -x tests/test_trusted_proof_pg.py tests/test_trusted_proof_pg_security.py tests/test_trusted_proof_envelope.py tests/test_independent_verifier.py
