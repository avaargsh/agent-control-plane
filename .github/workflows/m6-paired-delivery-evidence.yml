name: m6-paired-delivery-evidence
on:
  pull_request:
    paths:
      - 'examples/m6_paired_delivery_evidence.py'
      - 'tests/test_m6_paired_delivery_evidence.py'
      - 'examples/pr_watch_github_delivery_evidence.py'
      - 'tests/test_pr_watch_github_delivery_evidence.py'
      - 'docs/M6_PAIRED_DELIVERY_EVIDENCE.md'
      - '.github/workflows/m6-paired-delivery-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'examples/m6_paired_delivery_evidence.py'
      - 'tests/test_m6_paired_delivery_evidence.py'
      - 'examples/pr_watch_github_delivery_evidence.py'
      - '.github/workflows/m6-paired-delivery-evidence.yml'
permissions:
  contents: read
jobs:
  offline-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check examples/m6_paired_delivery_evidence.py tests/test_m6_paired_delivery_evidence.py examples/pr_watch_github_delivery_evidence.py tests/test_pr_watch_github_delivery_evidence.py
      - run: python -m pytest -q -x tests/test_m6_paired_delivery_evidence.py
