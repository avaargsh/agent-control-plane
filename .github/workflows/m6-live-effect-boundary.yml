name: m6-live-effect-boundary
on:
  pull_request:
    paths:
      - 'src/agent_control_plane/live_effect_boundary.py'
      - 'src/agent_control_plane/kubernetes_deployment_transition.py'
      - 'src/agent_control_plane/execution_lifecycle.py'
      - 'tests/test_live_effect_boundary.py'
      - 'tests/test_execution_lifecycle.py'
      - 'docs/M6_LIVE_EFFECT_BOUNDARY.md'
      - '.github/workflows/m6-live-effect-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'src/agent_control_plane/live_effect_boundary.py'
      - 'src/agent_control_plane/kubernetes_deployment_transition.py'
      - 'src/agent_control_plane/execution_lifecycle.py'
      - 'tests/test_live_effect_boundary.py'
      - '.github/workflows/m6-live-effect-boundary.yml'
permissions:
  contents: read
jobs:
  effect-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - name: Ruff effect-boundary regression
        run: python -m ruff check src/agent_control_plane/live_effect_boundary.py src/agent_control_plane/kubernetes_deployment_transition.py src/agent_control_plane/execution_lifecycle.py tests/test_live_effect_boundary.py
      - name: Current authority, denial and lifecycle regression
        run: python -m pytest -q -x tests/test_live_effect_boundary.py tests/test_execution_lifecycle.py
