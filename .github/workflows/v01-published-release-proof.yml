name: v0.1-published-release-proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "scripts/verify_execution_proof.py"
      - "scripts/verify_v01_acceptance_artifacts.py"
      - "scripts/verify_published_v01_release.sh"
      - "release/v0.1-acceptance-artifact-contract.json"
      - ".github/workflows/v01-published-release-proof.yml"

permissions:
  contents: read

jobs:
  published-proof-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install current verifier
        run: python -m pip install -e .
      - name: Verify public v0.1.0 release artifacts with current mainline verifier
        run: bash scripts/verify_published_v01_release.sh
