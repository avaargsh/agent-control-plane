name: v0.1-published-release-proof

# Release gates only: normal development PRs run .github/workflows/test.yml.
# Invoke manually on a candidate, or create an intentional v* release tag.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  published-proof-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install current verifier
        run: python -m pip install -e .
      - name: Verify public v0.1.0 release artifacts with current mainline verifier
        run: bash scripts/verify_published_v01_release.sh
