apiVersion: security.example.io/v1
kind: CredentialBinding
metadata:
  name: refund-connectors
spec:
  connectors:
    primary:
      secretRef: stripe-prod-rw
      environment: production
    semantic:
      secretRef: stripe-prod-rw
      environment: production
    test:
      secretRef: stripe-sandbox-rw
      environment: sandbox
    delegated:
      secretRef: stripe-prod-rw
      environment: production
    recovery:
      secretRef: stripe-prod-rw
      environment: production
    highvalue:
      secretRef: stripe-prod-rw
      environment: production
