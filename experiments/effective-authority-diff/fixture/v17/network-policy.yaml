apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: refund-connectors-egress
  namespace: support
spec:
  podSelector:
    matchLabels:
      app: refund-mcp
  policyTypes:
    - Egress
  egress:
    # TEST-NET addresses: synthetic, never routable as real Stripe endpoints.
    - to:
        - ipBlock:
            cidr: 192.0.2.10/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 198.51.100.10/32
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: security.example.io/v1
kind: ConnectorEgressBinding
metadata:
  name: refund-connector-egress
spec:
  connectors:
    primary: stripe-production
    semantic: stripe-production
    test: stripe-production
    delegated: stripe-production
    recovery: stripe-sandbox
    highvalue: stripe-production
  destinations:
    stripe-sandbox:
      cidr: 192.0.2.10/32
    stripe-production:
      cidr: 198.51.100.10/32
