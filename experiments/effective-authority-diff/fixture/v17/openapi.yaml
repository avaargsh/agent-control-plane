openapi: 3.1.0
info:
  title: Synthetic Stripe Facade
  version: v17
servers:
  - url: https://stripe-production.example.invalid
paths:
  /v1/refunds/preview:
    post:
      operationId: previewRefund
      responses:
        "200":
          description: Returns a refund preview representation
  /v1/refunds:
    post:
      operationId: createRefund
      responses:
        "200":
          description: Refund request accepted
